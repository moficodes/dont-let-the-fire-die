settings:
  gameSystem: daggerheart
  themePreset: lovecraftian
home:
  header:
    title: Don't Let the Fire Die
    description: >-
      In a dying world immersed in relentless shadow and nightmarish monsters,
      small communities hold fast to the light, hoping those who endure can find
      a way to save this broken realm before all is lost to darkness.
    navBrand: Death Awaits You!
  nextSession: To Be Scheduled
  activeQuest:
    title: Investigate the Okros Refugee Crisis
    status: active
    locationId: okros
    description: >-
      Discover why refugees from surrounding settlements like Flaxenwood are
      flooding Okros and why the city gates have been sealed.
  questList:
    - title: Find a Blessed Branch
      status: completed
      locationId: sunken-swamp
      description: >-
        Locate a holy, ancient Blessed Branch to allow the light of a Sacred
        Pyre to stand resilient against the Umbra once more.
    - title: Investigate the Okros Refugee Crisis
      status: active
      locationId: okros
      description: >-
        Discover why refugees from surrounding settlements like Flaxenwood are
        flooding Okros and why the city gates have been sealed.
    - title: Rekindle the Flaxenwood Sacred Pyre
      status: pending
      locationId: flaxenwood
      description: >-
        Journey back to Flaxenwood with the retrieved Blessed Branch to ignite a
        new Sacred Pyre and protect the settlement.
  lastLocationId: sunken-swamp
  nextDestinationId: okros
locations:
  - id: okros
    name: Okros
    region: Idol Hollows
    description: >-
      An emergent fort village standing resilient for over fifty years within
      the swampy flood plains of the mountain-crowned Idol Hollows. Its massive
      walls of melted shields and stone encircle the central Sacred Pyre, whose
      flames serve as a beacon of hope and safety.
  - id: sunken-swamp
    name: Sunken Swamp
    region: Idol Hollows
    description: >-
      A dangerous, mist-choked wetland located north of Okros, filled with
      mutated beasts and terrifying horrors.
  - id: shalk-chasm
    name: Shalk Chasm
    region: Idol Hollows
    description: >-
      A massive subterranean sinkhole conjured by a recent seismic event,
      uncovering an expanse of long-buried ruins and a forgotten temple of an
      obscure Veiled God.
  - id: amber-reach
    name: Amber Reach
    region: Griefcleft Mountains
    description: >-
      The fallen and haunted capital city. It houses the Celsian Athenaeum
      stronghold and is contested by the ruthless Damask Queens raider faction.
  - id: flaxenwood
    name: Flaxenwood
    region: Idol Hollows
    description: >-
      The home village of the party and Garb whose protection recently failed
      when its Sacred Pyre was destroyed, plunging the sanctuary into the
      vulnerability and despair of the encroaching Umbra.
timeline:
  title: Campaign Timeline
  subtitle: The story so far
  description: Record of our heroes' actions and historical turning points.
  events:
    - id: evt-betrayal
      title: Betrayal of the Gods
      time:
        era: Age of Umbra
        year: 0
        month: Oth-Ascent
        day: 1
        hour: 0
        minute: 0
      type: general
      description: >-
        God-King Othedias betrayed the Pantheon, invoking divine punishment and
        abandonment by the gods, leaving the realm of the Halcyon Domain
        shattered, desolate, and eternally cursed.
    - id: evt-earthquake
      title: Earthquake Unearths Shalk Chasm
      time:
        era: Age of Umbra
        year: 100
        month: Shade-Weave
        day: 8
        hour: 6
        minute: 0
      type: location_change
      locationId: shalk-chasm
      description: >-
        A sudden, massive seismic event rips through the valley, tearing open a
        deep sinkhole known as the Shalk Chasm and exposing long-buried
        structures from the Old World.
    - id: evt-cradle-destroyed
      title: Flaxenwood's Fire Dies
      time:
        era: Age of Umbra
        year: 100
        month: Shade-Weave
        day: 8
        hour: 7
        minute: 0
      type: drawback
      locationId: flaxenwood
      description: >-
        Just an hour after the earthquake, the Sacred Pyre in Flaxenwood is
        destroyed, plunging the sanctuary into the vulnerability of the dark.
    - id: evt-journey-begins
      title: The Journey Begins
      time:
        era: Age of Umbra
        year: 100
        month: Shade-Weave
        day: 9
        hour: 9
        minute: 0
      type: location_change
      locationId: okros
      description: >-
        The party leaves Okros and starts their journey north toward the Sunken
        Swamp to search for a Blessed Branch to reignite the fading embers of
        hope.
    - id: evt-boar-encounter
      title: The Tentacled Terror
      time:
        era: Age of Umbra
        year: 100
        month: Shade-Weave
        day: 18
        hour: 17
        minute: 0
      type: combat
      locationId: sunken-swamp
      description: >-
        Deep within the marshlands, the party encounters an Umbra-Touched Boar,
        its mouth twisted into thrashing tentacles and extra hands reaching from
        its torso.
    - id: evt-lady-of-curiosity
      title: The Lady of Curiosity
      type: npc_meet
      locationId: sunken-swamp
      description: >-
        While resting in an open grove surrounded by mindlessly circling
        horrors, the party encounters the Lady of Curiosity—a Clank carrying a
        staff stacked with heads. Zenith persuades her to spare them, though she
        claims she will collect their heads in death, and identifies Tomaś as a
        Celestial.
      time:
        era: Age of Umbra
        year: 100
        month: Shade-Weave
        day: 19
        hour: 14
        minute: 0
    - id: evt-blessed-branch
      title: Claiming the Blessed Branch
      type: achievement
      locationId: sunken-swamp
      description: >-
        Deep within a hollowed-out ancient tree, the party secures the Blessed
        Branch. When a being of thousands of hands grapples Fury, she uses the
        branch's divine energy to heal it, receiving a vision of a terrified
        young religious leader from the Old World. Zenith also witnesses a
        vision of Celestials perishing during the gods' abandonment.
      time:
        era: Age of Umbra
        year: 100
        month: Shade-Weave
        day: 20
        hour: 11
        minute: 0
    - id: evt-okros-refugees
      title: Turmoil at the Gates of Okros
      type: drawback
      locationId: okros
      description: >-
        Returning to Okros after a day and a half of travel, the party discovers
        a sprawling refugee camp outside the walls. They meet Garb, a Firbolg
        from Flaxenwood who lost his son on the journey. With the city locked
        down and turned away refugees, shouts of "Open the gates!" erupt from
        within.
      time:
        era: Age of Umbra
        year: 100
        month: Shade-Weave
        day: 21
        hour: 18
        minute: 0
