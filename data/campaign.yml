settings:
  gameSystem: daggerheart
  themePreset: lovecraftian
home:
  header:
    title: Don't Let the Fire Die
    description: >-
      In a dying world immersed in relentless shadow and nightmarish monsters,
      small communities hold fast to the light, hoping those who endure can find
      a way to save this broken realm before all is lost to darkness.
    navBrand: Death Awaits You!
  nextSession: To Be Scheduled
  activeQuest:
    title: Escape the Okros Ambush
    status: active
    locationId: okros
    description: >-
      Break through Syzl's militia encirclement at the hillside church garden
      and safely escape the fortified town of Okros with the Blessed Branch.
  questList:
    - title: Find a Blessed Branch
      status: completed
      locationId: sunken-swamp
      description: >-
        Locate a holy, ancient Blessed Branch to allow the light of a Sacred
        Pyre to stand resilient against the Umbra once more.
    - title: Investigate the Okros Refugee Crisis
      status: completed
      locationId: okros
      description: >-
        Discover why refugees from surrounding settlements like Flaxenwood are
        flooding Okros and why the city gates have been sealed.
    - title: Rekindle the Flaxenwood Sacred Pyre
      status: pending
      locationId: flaxenwood
      description: >-
        Journey back to Flaxenwood with the retrieved Blessed Branch to ignite a
        new Sacred Pyre and protect the settlement.
    - title: Escape the Okros Ambush
      status: active
      locationId: okros
      description: >-
        Break through Syzl's militia encirclement at the hillside church garden
        and safely escape the fortified town of Okros with the Blessed Branch.
    - title: Flaxenwood Relief Expedition
      status: pending
      locationId: flaxenwood
      description: >-
        Journey back to Flaxenwood through the Umbra to locate survivors, bring
        them back to Okros, or rekindle Flaxenwood's Sacred Pyre if the
        situation is dire.
  lastLocationId: okros
  nextDestinationId: flaxenwood
locations:
  - id: okros
    name: Okros
    region: Idol Hollows
    description: >-
      An emergent fortified town of melted shields and stone built around a
      central Sacred Pyre. Typically home to 2,500–3,000 residents, the collapse
      of surrounding village pyres has flooded Okros with over 4,000 refugees
      residing in dense tent encampments inside the walls and outside both
      eastern and western gates. The hillside church serves as weekly worship
      space, emergency council chamber, and crisis operations center.
  - id: sunken-swamp
    name: Sunken Swamp
    region: Idol Hollows
    description: >-
      A dangerous, mist-choked wetland located north of Okros, filled with
      mutated beasts and terrifying horrors.
  - id: shalk-chasm
    name: Shalk Chasm
    region: Idol Hollows
    description: >-
      A massive subterranean sinkhole conjured by a recent seismic event,
      uncovering an expanse of long-buried ruins and a forgotten temple of an
      obscure Veiled God.
  - id: amber-reach
    name: Amber Reach
    region: Griefcleft Mountains
    description: >-
      The fallen and haunted capital city. It houses the Celsian Athenaeum
      stronghold and is contested by the ruthless Damask Queens raider faction.
  - id: flaxenwood
    name: Flaxenwood
    region: Idol Hollows
    description: >-
      The home settlement of the party and Garb, consisting of roughly 500
      surface villagers alongside a thriving Underborne community of
      approximately 500 fairies dwelling in the cave networks directly beneath
      the town. The village is currently plunged into vulnerability following
      the loss of its Sacred Pyre.
timeline:
  title: Campaign Timeline
  subtitle: The story so far
  description: Record of our heroes' actions and historical turning points.
  events:
    - id: evt-betrayal
      title: Betrayal of the Gods
      time:
        era: Age of Umbra
        year: 0
        month: Oth-Ascent
        day: 1
        hour: 0
        minute: 0
      type: general
      description: >-
        God-King Othedias betrayed the Pantheon, invoking divine punishment and
        abandonment by the gods, leaving the realm of the Halcyon Domain
        shattered, desolate, and eternally cursed.
    - id: evt-earthquake
      title: Earthquake Unearths Shalk Chasm
      time:
        era: Age of Umbra
        year: 100
        month: Shade-Weave
        day: 8
        hour: 6
        minute: 0
      type: location_change
      locationId: shalk-chasm
      description: >-
        A sudden, massive seismic event rips through the valley, tearing open a
        deep sinkhole known as the Shalk Chasm and exposing long-buried
        structures from the Old World.
    - id: evt-cradle-destroyed
      title: Flaxenwood's Fire Dies
      time:
        era: Age of Umbra
        year: 100
        month: Shade-Weave
        day: 8
        hour: 7
        minute: 0
      type: drawback
      locationId: flaxenwood
      description: >-
        Just an hour after the earthquake, the Sacred Pyre in Flaxenwood is
        destroyed, plunging the sanctuary into the vulnerability of the dark.
    - id: evt-journey-begins
      title: The Journey Begins
      time:
        era: Age of Umbra
        year: 100
        month: Shade-Weave
        day: 9
        hour: 9
        minute: 0
      type: location_change
      locationId: okros
      description: >-
        The party leaves Okros and starts their journey north toward the Sunken
        Swamp to search for a Blessed Branch to reignite the fading embers of
        hope.
    - id: evt-boar-encounter
      title: The Tentacled Terror
      time:
        era: Age of Umbra
        year: 100
        month: Shade-Weave
        day: 18
        hour: 17
        minute: 0
      type: combat
      locationId: sunken-swamp
      description: >-
        Deep within the marshlands, the party encounters an Umbra-Touched Boar,
        its mouth twisted into thrashing tentacles and extra hands reaching from
        its torso.
    - id: evt-lady-of-curiosity
      title: The Lady of Curiosity
      type: npc_meet
      locationId: sunken-swamp
      description: >-
        While resting in an open grove surrounded by mindlessly circling
        horrors, the party encounters the Lady of Curiosity—a Clank carrying a
        staff stacked with heads. Zenith persuades her to spare them, though she
        claims she will collect their heads in death, and identifies Tomaś as a
        Celestial.
      time:
        era: Age of Umbra
        year: 100
        month: Shade-Weave
        day: 19
        hour: 14
        minute: 0
    - id: evt-blessed-branch
      title: Claiming the Blessed Branch
      type: achievement
      locationId: sunken-swamp
      description: >-
        Deep within a hollowed-out ancient tree, the party secures the Blessed
        Branch. When a being of thousands of hands grapples Fury, she uses the
        branch's divine energy to heal it, receiving a vision of a terrified
        young religious leader from the Old World. Zenith also witnesses a
        vision of Celestials perishing during the gods' abandonment.
      time:
        era: Age of Umbra
        year: 100
        month: Shade-Weave
        day: 20
        hour: 11
        minute: 0
    - id: evt-okros-refugees
      title: Turmoil at the Gates of Okros
      type: drawback
      locationId: okros
      description: >-
        Returning to Okros after a day and a half of travel, the party discovers
        a sprawling refugee camp outside the walls. They meet Garb, a Firbolg
        from Flaxenwood who lost his son on the journey. With the city locked
        down and turned away refugees, shouts of "Open the gates!" erupt from
        within.
      time:
        era: Age of Umbra
        year: 100
        month: Shade-Weave
        day: 21
        hour: 18
        minute: 0
    - id: evt-okros-midnight-council
      title: The Midnight Council at Okros
      type: npc_meet
      locationId: okros
      description: >-
        Syzl admits the party through the gates after spotting the Blessed
        Branch's beacon-like glow across the wastes. Passing sprawling refugee
        tent cities, the party is escorted to the hillside church where the
        council remains assembled near midnight. Orion takes Zenith toward the
        central pyre, explaining that Okros's 2,500-capacity infrastructure is
        collapsing under 4,000+ refugees, proposing a second sacred pyre in
        Okros. Simultaneously, Elder Akadona privately informs Stan Jr. and Fury
        that council hardliners favored taking the branch by force, leaving the
        moral burden of saving the refugees in the party's hands.
      time:
        era: Age of Umbra
        year: 100
        month: Shade-Weave
        day: 21
        hour: 19
        minute: 0
    - id: evt-church-garden-ambush
      title: Dawn Ambush at the Church Garden
      type: combat
      locationId: okros
      description: >-
        Resting in the church garden, the party resolves to return to Flaxenwood
        to rescue survivors before committing the branch, leaving Tomaś and Biff
        behind in safety while Biff scours the church for supplies. Anticipating
        the council's hostility if they refuse to relinquish the branch, the
        party sneaks out at dawn. However, Syzl anticipated their flight,
        positioning rooftop guards on adjacent buildings. As Stan Jr. and Zenith
        attempt to break out on foot, Syzl and his militia confront them, while
        Fury takes flight above the church clutching the glowing Blessed Branch.
      time:
        era: Age of Umbra
        year: 100
        month: Shade-Weave
        day: 22
        hour: 6
        minute: 0
players:
  - id: stan-jr
    name: Stan Jr.
    class: Ranger
    level: 3
    ancestry: Ribbet
    community: Wildborne
    subclass: ''
    tier: 1
    image: ''
    description: >-
      A loyal and vigilant Ribbet Ranger of Flaxenwood, raised from infancy by
      the village's human lorekeeper Stanley.
    backstory: >-
      Found as an orphaned child and taken in by Stanley, Stan Jr. grew up
      protecting Flaxenwood and learning the wild ways of the Idol Hollows. His
      straightforward demeanor led to a bitter clash with the Drakona militia
      leader Syzl during the party's passage through Okros.
    stats:
      agility: 3
      strength: 0
      finesse: 2
      instinct: 1
      presence: -1
      knowledge: 1
    backgroundQuestions: []
    connectionQuestions: []
  - id: zenith
    name: Zenith
    class: Brawler
    level: 3
    ancestry: Clank
    community: Ridgeborne
    subclass: ''
    tier: 1
    image: ''
    description: >-
      A stalwart Clank Brawler who awakened to sentience a century ago during
      the divine abandonment.
    backstory: >-
      Gained consciousness 100 years ago when the gods departed the mortal
      realm, found and guided in his early existence by the elf Willow. Zenith
      shares the deep instinctual kinship of all awakened Clanks—including Orion
      of Okros—while repeatedly fending off fanatical zealots bearing the symbol
      of the Shattered Sun who seek to eradicate all relics of the divine era.
    stats:
      agility: -1
      strength: 2
      finesse: 0
      instinct: 3
      presence: 1
      knowledge: 1
    backgroundQuestions: []
    connectionQuestions: []
  - id: fury
    name: Fury
    class: Seraph
    level: 3
    ancestry: Faerie
    community: Underborne
    subclass: ''
    tier: 1
    image: ''
    description: >-
      A devoted Faerie Seraph born in the Underborne cavern settlement beneath
      Flaxenwood.
    backstory: >-
      Raised in the subterranean cave network beneath Flaxenwood among 500
      fellow fairies under the maternal guidance of the witch matriarch Nyx.
      Imbued with sacred lore and light, Fury ventures above to rekindle hope
      for both the surface dwellers and her underground kin.
    stats:
      agility: 1
      strength: 3
      finesse: 1
      instinct: 1
      presence: 2
      knowledge: 0
    backgroundQuestions: []
    connectionQuestions: []
npcs:
  - id: tomas
    name: Tomaś
    role: Fighter
    location: okros
    description: >-
      A young human fighter of hidden Celestial heritage. Deemed too vulnerable
      for the perilous return journey to Flaxenwood, he was left sheltered in
      the quiet sanctuary of the church back garden in Okros alongside Biff.
  - id: biff
    name: Biff
    role: Warrior
    location: okros
    description: >-
      A skittish human rogue who aids the party. Deciding he and Tomaś would be
      liabilities in the dangerous trek back to Flaxenwood, the party left him
      in the church garden, where he discreetly scavenged church supplies to
      prepare for whatever comes next.
  - id: lady-of-curiosity
    name: Lady of Curiosity
    role: Information & Head Collector
    location: sunken-swamp
    description: >-
      An enigmatic and macabre Clank who traverses the Umbra carrying a staff
      stacked with severed heads. She collects knowledge and secrets, formed a
      curious bond with Zenith, and revealed that Tomaś possesses Celestial
      blood.
  - id: garb-firbolg
    name: Garb
    role: Flaxenwood Refugee
    location: okros
    description: >-
      A grief-stricken Firbolg villager from Flaxenwood stranded outside the
      gates of Okros after losing his son during the grueling trek across the
      wastes.
  - id: stanley
    name: Stanley
    role: Human Lorekeeper & Foster Father
    location: flaxenwood
    description: >-
      A wise human lorekeeper residing in Flaxenwood who took in Stan Jr. as an
      orphaned child at a very young age, raising and mentoring him as a loving
      father figure.
  - id: syzl
    name: Syzl
    role: Okros Militia Leader
    location: okros
    description: >-
      A stern, battle-weary Drakona commander of the Okros militia. Facing
      severe overcrowding from 4,000+ refugees and the strain of defending the
      walls, he admitted the party after spotting the Blessed Branch's glow.
      Correctly anticipating the party would flee rather than surrender the
      branch, he placed rooftop snipers above the church garden and blocked
      their escape with his guards.
  - id: willow
    name: Willow
    role: Elven Rescuer & Companion
    location: flaxenwood
    description: >-
      An elf who discovered Zenith nearly 100 years ago during the Betrayal of
      the Gods when Zenith first awakened to consciousness and sentience.
  - id: orion
    name: Orion
    role: Metalworks Master & Council Member
    location: okros
    description: >-
      A Clank who awakened to sentience 100 years ago during the divine
      abandonment, now overseeing the Okros forge and sitting on the town
      council. Sharing an unspoken kinship with Zenith, he walked Zenith to the
      central pyre to plead the plight of 4,000+ refugees and proposed igniting
      a second Sacred Pyre in Okros using the Blessed Branch.
  - id: nyx
    name: Nyx
    role: Faerie Witch & Underborne Matriarch
    location: flaxenwood
    description: >-
      A venerable faerie witch, lorekeeper, and matriarch of the 500-strong
      Underborne faerie colony dwelling in the caves beneath Flaxenwood. She
      served as a mother and grandmother figure to Fury, imparting deep worldly
      lore and ancient wisdom.
  - id: wanda
    name: Wanda
    role: Underborne Faerie
    location: flaxenwood
    description: >-
      A faerie belonging to the subterranean Underborne community beneath
      Flaxenwood, known to Fury.
  - id: elder-akadona
    name: Elder Akadona
    role: Town Elder & Council Leader
    location: okros
    description: >-
      A venerable female orc elder over 120 years old who leads the governing
      council of Okros. Frail of body and relying on a walking stick, she chose
      transparency and reason over violence, resisting council hardliners who
      demanded seizing the party's Blessed Branch by force.
