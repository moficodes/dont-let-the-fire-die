home:
  header:
    title: Sablewood Chronicles
    description: >-
      Welcome to the living record of our adventures, heroes, and the world we
      shape together.
    navBrand: Sablewood
  nextSession: May 15, 7 PM EST
  questList:
    - title: Deliver the Box to Hush
      status: active
      locationId: hush
      description: >-
        King Emeris has tasked Orna Kaan and her newly recruited companions,  to
        deliver a mysterious box from the capital of Solitaire to the village of
        Hush.
locations:
  - id: solitaire
    name: Solitaire
    region: Kingdom of Hearth
    description: >-
      The capital city of the Kingdom of Hearth and the seat of King Emeris. It
      serves as the main trade hub of the kingdom. The city has stood for
      thousands of years and is magically protected through wards and runes,
      with a total population of eight thousand.
  - id: hush
    name: Hush
    region: Unknown
    description: >-
      A village that the party is currently traveling towards to deliver a box
      for King Emeris.
  - id: sablewood-forest
    name: The Sablewood Forest
    description: >-
      The Sablewood is an ancient, expansive forest of trees that reach hundreds
      of feet into the air. Rumored to be older than the Forgotten Gods, this
      dense wood is widely known throughout the Mortal Realm, and many who visit
      are surprised to learn that the stories they believed were exaggerated
      legends are, in fact, stark truths.
