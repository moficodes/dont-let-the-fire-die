        hour: 12
        minute: 45
      type: location_change
      description: The party takes the box with them and starts their journey towards Hush.
      locationId: solitaire
    - id: evt-ambush
      title: Ambush on the Road
      time:
        era: Enlightenement
        year: 3982
        month: Tolmir
        day: 4
        hour: 19
        minute: 0
      type: combat
      description: >-
        The party finds a cart in the road that was blocked. They encounter a
        group of strix wolf. Once they peacefully deal with the Strix Wolf, they
        were ambushed by a group of thistle folk. The party barely manages to
        fight them off.
